<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Borç Takibim" />
<meta name="theme-color" content="#12161d" />
<title>Borç Takibim</title>
<link rel="icon" href="data:,">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #12161d;
    --surface: #1b212b;
    --surface-2: #232b37;
    --border: #313b49;
    --text: #edeff3;
    --text-muted: #8b93a3;
    --gold: #c9a24b;
    --teal: #4fa8a0;
    --danger: #d6746a;
  }

  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: 'Inter', sans-serif; min-height: 100vh; -webkit-font-smoothing: antialiased;
  }
  body {
    padding: 20px 16px 64px;
    padding-top: max(20px, env(safe-area-inset-top));
    padding-bottom: max(64px, env(safe-area-inset-bottom));
  }
  *:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  .container { width: 100%; max-width: 480px; margin: 0 auto; }

  .header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 18px; }
  .header h1 { font-family: 'Fraunces', serif; font-weight: 600; font-size: 22px; margin: 0; letter-spacing: 0.2px; }
  .header .date { font-size: 12px; color: var(--text-muted); font-variant: small-caps; }

  .summary {
    background: linear-gradient(155deg, var(--surface-2), var(--surface));
    border: 1px solid var(--border); border-radius: 18px; padding: 20px 20px 18px; margin-bottom: 22px;
  }
  .summary-label { font-size: 12px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--text-muted); margin-bottom: 6px; }
  .net-total { font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 32px; line-height: 1.1; margin-bottom: 16px; word-break: break-word; }
  .net-total.positive { color: var(--teal); }
  .net-total.negative { color: var(--danger); }

  .sub-stats { display: flex; gap: 10px; margin-bottom: 4px; }
  .sub-stat { flex: 1; background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; }
  .sub-stat-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-muted); margin-bottom: 4px; }
  .sub-stat-value { font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 600; }
  .sub-stat-value.assets { color: var(--teal); }
  .sub-stat-value.debts { color: var(--gold); }

  .monthly-due {
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(201,162,75,0.08); border: 1px solid rgba(201,162,75,0.25);
    border-radius: 12px; padding: 10px 12px; margin-top: 10px;
  }
  .monthly-due-label { font-size: 11.5px; color: var(--text-muted); }
  .monthly-due-value { font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 600; color: var(--gold); }

  .tear { height: 1px; border-top: 1px dashed var(--border); margin: 0 0 22px; }

  .section-title { font-family: 'Fraunces', serif; font-size: 15px; font-weight: 600; color: var(--text-muted); margin: 0 0 12px; letter-spacing: 0.3px; display: flex; align-items: center; justify-content: space-between; }
  .section-total { font-family: 'IBM Plex Mono', monospace; font-size: 13px; }

  .item-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; margin-bottom: 12px; overflow: hidden; }
  .item-head {
    display: flex; align-items: center; gap: 12px; padding: 14px; cursor: pointer; background: none; border: none;
    width: 100%; text-align: left; color: var(--text); font-family: inherit;
  }
  .item-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .item-name { flex: 1; font-size: 15px; font-weight: 500; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item-sub { font-size: 11px; color: var(--text-muted); font-weight: 400; }
  .item-total { font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 600; }
  .chevron { color: var(--text-muted); transition: transform .25s ease; flex-shrink: 0; }
  .chevron.open { transform: rotate(180deg); }

  .item-body { border-top: 1px solid var(--border); padding: 6px 14px 14px; display: none; }
  .item-body.open { display: block; }

  .entry-block { padding: 10px 0; border-bottom: 1px solid var(--border); }
  .entry-block:last-of-type { border-bottom: none; }
  .entry-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .entry-desc { font-size: 13.5px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .entry-badge {
    display: inline-block; font-size: 10px; font-weight: 600; color: var(--gold);
    background: rgba(201,162,75,0.12); border-radius: 5px; padding: 1px 6px; margin-left: 6px; vertical-align: middle;
  }
  .entry-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .entry-amount { font-family: 'IBM Plex Mono', monospace; font-size: 13.5px; }
  .entry-meta { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

  .dots { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .dot-inst {
    width: 16px; height: 16px; border-radius: 5px; border: 1px solid var(--border);
    background: var(--bg); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0;
  }
  .dot-inst.paid { background: var(--gold); border-color: var(--gold); }
  .dot-inst svg { width: 10px; height: 10px; }

  .icon-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 4px; display: flex; align-items: center; border-radius: 6px; }
  .icon-btn:hover { color: var(--danger); background: rgba(214,116,106,0.1); }

  .empty-entries { font-size: 12.5px; color: var(--text-muted); padding: 10px 0; font-style: italic; }

  .add-entry-btn, .del-item-btn {
    display: flex; align-items: center; gap: 6px; font-size: 13px; background: none; border: none;
    cursor: pointer; padding: 6px 0; font-family: inherit; margin-top: 6px;
  }
  .del-item-btn { color: var(--danger); }

  .inline-form { display: none; flex-direction: column; gap: 8px; margin-top: 8px; background: var(--surface-2); border-radius: 10px; padding: 10px; }
  .inline-form.open { display: flex; }
  .inline-form input {
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 9px 10px;
    color: var(--text); font-size: 13.5px; font-family: inherit; width: 100%;
  }
  .inline-form input::placeholder { color: var(--text-muted); }

  .mode-toggle { display: flex; gap: 6px; margin-bottom: 2px; }
  .mode-btn {
    flex: 1; font-family: inherit; font-size: 12.5px; padding: 7px 8px; border-radius: 7px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text-muted); cursor: pointer;
  }
  .mode-btn.active { background: var(--gold); color: #1b1607; border-color: var(--gold); font-weight: 600; }

  .installment-fields { display: none; flex-direction: column; gap: 8px; }
  .installment-fields.open { display: flex; }
  .installment-fields-row { display: flex; gap: 8px; }
  .simple-fields { display: flex; flex-direction: column; gap: 8px; }
  .simple-fields.hidden { display: none; }

  .form-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .btn { font-family: inherit; font-size: 13px; font-weight: 500; padding: 8px 14px; border-radius: 8px; border: none; cursor: pointer; }
  .btn-primary { color: #1b1607; }
  .btn-ghost { background: none; color: var(--text-muted); }
  .btn-ghost:hover { color: var(--text); }

  .add-item-btn {
    width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 13px;
    border-radius: 14px; border: 1px dashed var(--border); background: none; color: var(--text-muted);
    font-family: inherit; font-size: 14px; cursor: pointer; margin-top: 4px; margin-bottom: 28px;
  }

  .new-item-form {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px;
    margin-top: 4px; margin-bottom: 28px; display: none; flex-direction: column; gap: 10px;
  }
  .new-item-form.open { display: flex; }
  .new-item-form input {
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 9px 10px;
    color: var(--text); font-size: 13.5px; font-family: inherit; width: 100%;
  }

  .empty-state { text-align: center; padding: 24px 10px 16px; color: var(--text-muted); }
  .empty-state .icon-wrap {
    width: 40px; height: 40px; border-radius: 50%; background: var(--surface-2); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; margin: 0 auto 10px; font-size: 18px;
  }
  .empty-state p { font-size: 13px; margin: 0; line-height: 1.5; }

  svg { display: block; }
</style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Borç Takibim</h1>
      <span class="date" id="today"></span>
    </div>

    <div class="summary">
      <div class="summary-label">Net Durum</div>
      <div class="net-total" id="netTotal">₺0,00</div>
      <div class="sub-stats">
        <div class="sub-stat">
          <div class="sub-stat-label">Toplam Varlık</div>
          <div class="sub-stat-value assets" id="totalAssets">₺0,00</div>
        </div>
        <div class="sub-stat">
          <div class="sub-stat-label">Toplam Borç</div>
          <div class="sub-stat-value debts" id="totalDebts">₺0,00</div>
        </div>
      </div>
      <div class="monthly-due" id="monthlyDueWrap" style="display:none;">
        <span class="monthly-due-label">Bu ayki toplam taksit</span>
        <span class="monthly-due-value" id="monthlyDueValue">₺0,00</span>
      </div>
    </div>

    <div class="section-title">
      <span>Varlıklarım</span>
      <span class="section-total" id="assetsSectionTotal" style="color:var(--teal)"></span>
    </div>
    <div id="assetsEmptyState" class="empty-state" style="display:none;">
      <div class="icon-wrap">💰</div>
      <p>Henüz varlık eklemedin.<br>Nakit, yatırım vb. ekleyebilirsin.</p>
    </div>
    <div id="assetList"></div>
    <form class="new-item-form" id="newAssetForm">
      <input id="newAssetInput" placeholder="Kategori adı (örn. Nakit, Yatırım Hesabı)" />
      <div class="form-actions">
        <button type="button" class="btn btn-ghost" id="cancelAssetBtn">Vazgeç</button>
        <button type="submit" class="btn btn-primary" style="background:var(--teal)">Ekle</button>
      </div>
    </form>
    <button class="add-item-btn" id="showAddAssetBtn">+ Yeni kategori ekle</button>

    <div class="tear"></div>

    <div class="section-title">
      <span>Bankalar (Borçlar)</span>
      <span class="section-total" id="banksSectionTotal" style="color:var(--gold)"></span>
    </div>
    <div id="bankEmptyState" class="empty-state" style="display:none;">
      <div class="icon-wrap">🏦</div>
      <p>Henüz banka eklemedin.<br>Başlamak için aşağıdan bir banka ekle.</p>
    </div>
    <div id="bankList"></div>
    <form class="new-item-form" id="newBankForm">
      <input id="newBankInput" placeholder="Banka adı (örn. Ziraat Bankası)" />
      <div class="form-actions">
        <button type="button" class="btn btn-ghost" id="cancelBankBtn">Vazgeç</button>
        <button type="submit" class="btn btn-primary" style="background:var(--gold)">Ekle</button>
      </div>
    </form>
    <button class="add-item-btn" id="showAddBankBtn">+ Yeni banka ekle</button>
  </div>

<script>
  const STORAGE_KEY = 'borc-takibi-data';
  const PALETTE = ['#C9A24B','#4FA8A0','#8C86D6','#D07A6A','#6FA8D6','#8FBF7F','#D6A0C4','#B7935A'];

  function uid() { return Math.random().toString(36).slice(2,10) + Date.now().toString(36); }

  function loadData() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        return { banks: parsed.banks || [], assets: parsed.assets || [] };
      }
    } catch (e) {}
    return { banks: [], assets: [] };
  }
  function saveData() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  let state = loadData();
  let expanded = {};
  let addingEntryFor = null; // { group, id }

  function currency(n) {
    const val = Number.isFinite(n) ? n : 0;
    return '₺' + val.toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function parseAmount(str) {
    if (!str) return 0;
    const cleaned = str.replace(/\./g, '').replace(',', '.').replace(/[^0-9.]/g, '');
    const n = parseFloat(cleaned);
    return Number.isFinite(n) ? n : 0;
  }
  function parseInt2(str) {
    const n = parseInt((str || '').replace(/[^0-9]/g, ''), 10);
    return Number.isFinite(n) ? n : 0;
  }

  // remaining amount owed for one entry
  function entryRemaining(entry) {
    if (entry.isInstallment) {
      const remainingCount = Math.max(0, (entry.totalInstallments || 0) - (entry.paidInstallments || 0));
      return remainingCount * (entry.monthlyAmount || 0);
    }
    return entry.amount || 0;
  }
  // this month's due for one entry (0 if fully paid or not installment)
  function entryMonthlyDue(entry) {
    if (!entry.isInstallment) return 0;
    const remainingCount = Math.max(0, (entry.totalInstallments || 0) - (entry.paidInstallments || 0));
    return remainingCount > 0 ? (entry.monthlyAmount || 0) : 0;
  }

  function itemTotal(item) { return item.debts.reduce((s,d) => s + entryRemaining(d), 0); }
  function itemMonthlyDue(item) { return item.debts.reduce((s,d) => s + entryMonthlyDue(d), 0); }

  function esc(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function renderGroup(groupKey, listElId, emptyElId, entryNoun, allowInstallments) {
    const items = state[groupKey];
    const listEl = document.getElementById(listElId);
    const emptyEl = document.getElementById(emptyElId);
    listEl.innerHTML = '';
    emptyEl.style.display = items.length === 0 ? 'block' : 'none';

    items.forEach(item => {
      const expKey = groupKey + ':' + item.id;
      const isOpen = !!expanded[expKey];
      const total = itemTotal(item);

      const card = document.createElement('div');
      card.className = 'item-card';

      const head = document.createElement('button');
      head.className = 'item-head';
      head.innerHTML =
        '<span class="item-dot" style="background:' + item.color + '"></span>' +
        '<span class="item-name">' + esc(item.name) +
          '<div class="item-sub">' + item.debts.length + ' ' + entryNoun + '</div>' +
        '</span>' +
        '<span class="item-total">' + currency(total) + '</span>' +
        '<svg class="chevron' + (isOpen ? ' open' : '') + '" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>';
      head.onclick = () => { expanded[expKey] = !expanded[expKey]; renderAll(); };
      card.appendChild(head);

      const body = document.createElement('div');
      body.className = 'item-body' + (isOpen ? ' open' : '');

      if (item.debts.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty-entries';
        empty.textContent = 'Henüz kayıt yok.';
        body.appendChild(empty);
      } else {
        item.debts.forEach(d => {
          const block = document.createElement('div');
          block.className = 'entry-block';

          const row = document.createElement('div');
          row.className = 'entry-row';
          const badge = d.isInstallment ? '<span class="entry-badge">' + d.paidInstallments + '/' + d.totalInstallments + ' taksit</span>' : '';
          row.innerHTML =
            '<span class="entry-desc">' + esc(d.desc) + badge + '</span>' +
            '<span class="entry-right">' +
              '<span class="entry-amount">' + currency(entryRemaining(d)) + '</span>' +
              '<button class="icon-btn" aria-label="Sil"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg></button>' +
            '</span>';
          row.querySelector('.icon-btn').onclick = () => {
            item.debts = item.debts.filter(x => x.id !== d.id);
            saveData(); renderAll();
          };
          block.appendChild(row);

          if (d.isInstallment) {
            const meta = document.createElement('div');
            meta.className = 'entry-meta';
            meta.textContent = 'Aylık ' + currency(d.monthlyAmount) + ' · kalan ' + Math.max(0, d.totalInstallments - d.paidInstallments) + ' taksit — ödenenleri işaretlemek için dokun';
            block.appendChild(meta);

            const dots = document.createElement('div');
            dots.className = 'dots';
            for (let i = 0; i < d.totalInstallments; i++) {
              const dot = document.createElement('button');
              dot.type = 'button';
              dot.className = 'dot-inst' + (i < d.paidInstallments ? ' paid' : '');
              if (i < d.paidInstallments) {
                dot.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="#1b1607" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>';
              }
              dot.onclick = (() => {
                const idx = i;
                return () => {
                  d.paidInstallments = (d.paidInstallments === idx + 1) ? idx : idx + 1;
                  saveData(); renderAll();
                };
              })();
              dots.appendChild(dot);
            }
            block.appendChild(dots);
          }

          body.appendChild(block);
        });
      }

      if (addingEntryFor && addingEntryFor.group === groupKey && addingEntryFor.id === item.id) {
        const form = document.createElement('form');
        form.className = 'inline-form open';

        let formHtml = '<input class="entry-desc-input" placeholder="Açıklama (örn. Kredi kartı, market alışverişi)" />';

        if (allowInstallments) {
          formHtml +=
            '<div class="mode-toggle">' +
              '<button type="button" class="mode-btn active" data-mode="simple">Tek Kalem</button>' +
              '<button type="button" class="mode-btn" data-mode="installment">Taksitli</button>' +
            '</div>' +
            '<div class="simple-fields">' +
              '<input class="entry-amount-input" placeholder="Tutar (₺)" inputmode="decimal" />' +
            '</div>' +
            '<div class="installment-fields">' +
              '<div class="installment-fields-row">' +
                '<input class="inst-monthly-input" placeholder="Aylık taksit (₺)" inputmode="decimal" />' +
                '<input class="inst-total-input" placeholder="Toplam taksit" inputmode="numeric" />' +
              '</div>' +
              '<input class="inst-paid-input" placeholder="Şimdiye kadar ödenen taksit sayısı (örn. 2)" inputmode="numeric" />' +
            '</div>';
        } else {
          formHtml += '<input class="entry-amount-input" placeholder="Tutar (₺)" inputmode="decimal" />';
        }

        formHtml +=
          '<div class="form-actions">' +
            '<button type="button" class="btn btn-ghost cancel-entry">Vazgeç</button>' +
            '<button type="submit" class="btn btn-primary" style="background:' + item.color + '">Ekle</button>' +
          '</div>';

        form.innerHTML = formHtml;

        if (allowInstallments) {
          const simpleFieldsEl = form.querySelector('.simple-fields');
          const instFieldsEl = form.querySelector('.installment-fields');
          const modeBtns = form.querySelectorAll('.mode-btn');
          modeBtns.forEach(btn => {
            btn.onclick = () => {
              modeBtns.forEach(b => b.classList.remove('active'));
              btn.classList.add('active');
              if (btn.dataset.mode === 'installment') {
                simpleFieldsEl.classList.add('hidden');
                instFieldsEl.classList.add('open');
              } else {
                simpleFieldsEl.classList.remove('hidden');
                instFieldsEl.classList.remove('open');
              }
            };
          });
        }

        form.onsubmit = (e) => {
          e.preventDefault();
          const desc = form.querySelector('.entry-desc-input').value.trim() || 'Kayıt';
          const isInstMode = allowInstallments && form.querySelector('.mode-btn[data-mode="installment"]').classList.contains('active');

          if (isInstMode) {
            const monthlyAmount = parseAmount(form.querySelector('.inst-monthly-input').value);
            const totalInstallments = parseInt2(form.querySelector('.inst-total-input').value);
            let paidInstallments = parseInt2(form.querySelector('.inst-paid-input').value);
            if (monthlyAmount <= 0 || totalInstallments <= 0) return;
            if (paidInstallments > totalInstallments) paidInstallments = totalInstallments;
            item.debts.push({ id: uid(), desc, isInstallment: true, monthlyAmount, totalInstallments, paidInstallments });
          } else {
            const amount = parseAmount(form.querySelector('.entry-amount-input').value);
            if (amount <= 0) return;
            item.debts.push({ id: uid(), desc, isInstallment: false, amount });
          }
          addingEntryFor = null;
          saveData(); renderAll();
        };
        form.querySelector('.cancel-entry').onclick = () => { addingEntryFor = null; renderAll(); };
        body.appendChild(form);
        setTimeout(() => form.querySelector('.entry-desc-input').focus(), 0);
      } else {
        const addBtn = document.createElement('button');
        addBtn.className = 'add-entry-btn';
        addBtn.style.color = item.color;
        addBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Ekle';
        addBtn.onclick = () => { addingEntryFor = { group: groupKey, id: item.id }; renderAll(); };
        body.appendChild(addBtn);
      }

      const delBtn = document.createElement('button');
      delBtn.className = 'del-item-btn';
      delBtn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg> Sil';
      delBtn.onclick = () => {
        state[groupKey] = state[groupKey].filter(x => x.id !== item.id);
        saveData(); renderAll();
      };
      body.appendChild(delBtn);

      card.appendChild(body);
      listEl.appendChild(card);
    });
  }

  function renderAll() {
    const totalDebts = state.banks.reduce((s,b) => s + itemTotal(b), 0);
    const totalAssets = state.assets.reduce((s,a) => s + itemTotal(a), 0);
    const monthlyDue = state.banks.reduce((s,b) => s + itemMonthlyDue(b), 0);
    const net = totalAssets - totalDebts;

    document.getElementById('totalDebts').textContent = currency(totalDebts);
    document.getElementById('totalAssets').textContent = currency(totalAssets);
    document.getElementById('banksSectionTotal').textContent = currency(totalDebts);
    document.getElementById('assetsSectionTotal').textContent = currency(totalAssets);

    const netEl = document.getElementById('netTotal');
    netEl.textContent = (net < 0 ? '-' : '') + currency(Math.abs(net));
    netEl.className = 'net-total ' + (net >= 0 ? 'positive' : 'negative');

    const dueWrap = document.getElementById('monthlyDueWrap');
    if (monthlyDue > 0) {
      dueWrap.style.display = 'flex';
      document.getElementById('monthlyDueValue').textContent = currency(monthlyDue);
    } else {
      dueWrap.style.display = 'none';
    }

    renderGroup('banks', 'bankList', 'bankEmptyState', 'borç kalemi', true);
    renderGroup('assets', 'assetList', 'assetsEmptyState', 'kayıt', false);
  }

  document.getElementById('today').textContent = new Date().toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric' });

  function setupAddForm(showBtnId, formId, inputId, cancelBtnId, groupKey) {
    const showBtn = document.getElementById(showBtnId);
    const form = document.getElementById(formId);
    const input = document.getElementById(inputId);
    showBtn.onclick = () => { form.classList.add('open'); showBtn.style.display = 'none'; input.focus(); };
    document.getElementById(cancelBtnId).onclick = () => { form.classList.remove('open'); showBtn.style.display = 'flex'; input.value = ''; };
    form.onsubmit = (e) => {
      e.preventDefault();
      const name = input.value.trim();
      if (!name) return;
      const id = uid();
      state[groupKey].push({ id, name, color: PALETTE[state[groupKey].length % PALETTE.length], debts: [] });
      expanded[groupKey + ':' + id] = true;
      input.value = '';
      form.classList.remove('open');
      showBtn.style.display = 'flex';
      saveData(); renderAll();
    };
  }

  setupAddForm('showAddBankBtn', 'newBankForm', 'newBankInput', 'cancelBankBtn', 'banks');
  setupAddForm('showAddAssetBtn', 'newAssetForm', 'newAssetInput', 'cancelAssetBtn', 'assets');

  renderAll();
</script>
</body>
</html>
